<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VedicVision AI - Divine Insight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Quicksand', 'sans-serif'],
            },
            colors: {
              vedic: {
                primary: '#3e2723',    // Dark Wood
                secondary: '#5d3a1a',  // Medium Wood
                accent: '#b45309',     // Bronze/Gold
                light: '#fdfbf7',      // Parchment Light
                paper: '#f4e4bc',      // Parchment Dark
                highlight: '#9f1239',  // Crimson
                gold: '#dcbe88',       // Muted Gold
              }
            },
            animation: {
              'spin-slow': 'spin 120s linear infinite',
              'reverse-spin': 'reverse-spin 120s linear infinite',
              'fade-in': 'fadeIn 0.5s ease-out',
            },
            keyframes: {
              'reverse-spin': {
                'from': { transform: 'rotate(360deg)' },
                'to': { transform: 'rotate(0deg)' },
              },
              fadeIn: {
                'from': { opacity: '0', transform: 'translateY(10px)' },
                'to': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f5deb3;
        color: #3e2723;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(62, 39, 35, 0.1);
      }
      ::-webkit-scrollbar-thumb {
        background: #b45309;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9f1239;
      }
      .glass-panel {
        background: rgba(253, 251, 247, 0.85);
        backdrop-filter: blur(12px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
