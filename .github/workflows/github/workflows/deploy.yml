name: Deploy VedicVision-AI to GitHub Pages

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master

permissions:
  contents: write # Grants the action permission to push to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project with Secrets
        # This injects your GitHub Repository Secret into Vite's environment variables
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }} 
        run: npm run build

      - name: Deploy Build to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite builds to the 'dist' folder by default
          branch: gh-pages
